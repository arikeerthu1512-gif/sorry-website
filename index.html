<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffb199);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* Animated background */

.bg-hearts{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:1;
}

.bg-hearts span{
    position:absolute;
    display:block;
    color:rgba(255,255,255,0.7);
    animation:float 10s linear infinite;
    bottom:-100px;
}

@keyframes float{
    0%{
        transform:translateY(0) scale(0);
        opacity:0;
    }

    30%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(2);
        opacity:0;
    }
}

/* Main Card */

.card{
    position:relative;
    z-index:10;
    width:90%;
    max-width:650px;
    padding:50px;
    border-radius:35px;
    background:rgba(255,255,255,0.18);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
    text-align:center;
    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-family:'Dancing Script',cursive;
    font-size:70px;
    color:white;
    margin-bottom:20px;
    text-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.message{
    color:white;
    font-size:20px;
    line-height:1.9;
    margin-bottom:35px;
    font-weight:300;
}

/* Typing Effect */

.typing{
    border-right:3px solid white;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(40,end) forwards,
              blink .8s infinite;
}

@keyframes typing{
    from{width:0}
    to{width:100%}
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

/* Buttons */

.buttons{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:18px;
    cursor:pointer;
    transition:0.4s;
    font-weight:600;
}

.yes-btn{
    background:white;
    color:#ff4d88;
}

.yes-btn:hover{
    transform:scale(1.1);
    box-shadow:0 10px 25px rgba(255,255,255,0.4);
}

.no-btn{
    background:rgba(255,255,255,0.2);
    color:white;
    border:1px solid white;
    position:relative;
}

/* Final Message */

.final-message{
    display:none;
    margin-top:30px;
    font-size:30px;
    color:white;
    animation:pop 1s ease;
}

@keyframes pop{
    0%{
        transform:scale(0);
    }
    100%{
        transform:scale(1);
    }
}

/* Music Button */

.music-btn{
    position:absolute;
    top:20px;
    right:20px;
    background:white;
    border:none;
    width:50px;
    height:50px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
    z-index:20;
}

</style>
</head>

<body>

<!-- Floating Hearts -->
<div class="bg-hearts" id="hearts"></div>

<!-- Music -->
<audio id="bgMusic" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<button class="music-btn" onclick="toggleMusic()">🎵</button>

<!-- Main Card -->
<div class="card">

    <h1>I'm Sorry Keerthu ❤️</h1>

    <p class="message typing">
        I know I made mistakes...  
        But losing you would be the biggest mistake of my life.
    </p>

    <br><br>

    <p class="message">
        Every moment without you feels incomplete.  
        Your smile is my peace, your love is my happiness.  
        Please forgive this stupid heart once again 🥺
    </p>

    <div class="buttons">
        <button class="yes-btn" onclick="forgive()">Forgive Me ❤️</button>
        <button class="no-btn" id="noBtn">No 😒</button>
    </div>

    <div class="final-message" id="finalMessage">
        YAYYY ❤️🥹<br>
        Thank you for forgiving me my love 💖
    </div>

</div>

<script>

/* Floating Hearts */

const heartsContainer = document.getElementById("hearts");

function createHeart(){
    const heart = document.createElement("span");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = Math.random()*30 + 20 + "px";
    heart.style.animationDuration = Math.random()*5 + 5 + "s";

    heartsContainer.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },10000);
}

setInterval(createHeart,300);

/* Forgive Button */

function forgive(){
    document.getElementById("finalMessage").style.display = "block";

    for(let i=0;i<80;i++){
        createHeart();
    }
}

/* Escaping No Button */

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {

    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 80);

    noBtn.style.position = "absolute";
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

/* Music */

const music = document.getElementById("bgMusic");

function toggleMusic(){

    if(music.paused){
        music.play();
    }else{
        music.pause();
    }
}

</script>

</body>
</html>
